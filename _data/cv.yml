cv:
  name: Rodolfo Ostilla Mónico
  label: Associate Professor (Profesor Titular), Fluid Mechanics
  email: rodolfo.ostilla@uca.es
  location: Puerto Real, Cádiz, Spain
  image: ""
  summary: >-
    Fluid dynamicist specializing in the direct numerical simulation of
    turbulent flows, with research spanning thermal convection and
    sustainable ventilation, the hydrodynamics of musical instruments,
    shear and vortex flows, and the physics of watersports. According to
    Clarivate/WoS, an h-index of 22 and over 1,400 citations across 59
    peer-reviewed articles, including publications in Physical Review
    Letters, Journal of Fluid Mechanics, Science Advances, and PNAS.
    Previously a postdoctoral researcher at Harvard University and
    Assistant Professor at the University of Houston; now an Emergia
    fellow and Associate Professor at the Universidad de Cádiz.
